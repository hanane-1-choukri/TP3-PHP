<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>
    <form action="traitement.php" method="POST"></br>
        <label>Nom :</label>
        <input type="text" name="nom" required></br>

        <label>Note en informatique :</label>
        <input type="number" name="note_info" min="0" max="20"
               step="0.01" required></br>

        <label>Note en mathématiques :</label>
        <input type="number" name="note_math" min="0" max="20"
               step="0.01" required></br>

        </br><button type="submit">Enregistrer</button>
    </form>
</body>
</html>
